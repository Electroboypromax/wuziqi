<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联机五子棋</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #f3f4f6;
            padding: 20px;
        }

        .room {
            margin: 20px 0;
            display: flex;
            gap: 10px;
        }

        input, button {
            padding: 10px 14px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }

        button {
            background: #4f46e5;
            color: white;
            cursor: pointer;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .status {
            font-size: 18px;
            margin: 10px 0;
            color: #333;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(15, 30px);
            gap: 1px;
            background: #deb887;
            padding: 10px;
            border: 2px solid #8b4513;
        }

        .cell {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }

        .cell::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 1px;
            background: #333;
        }

        .cell::after {
            content: '';
            position: absolute;
            width: 1px;
            height: 100%;
            background: #333;
        }

        .black, .white {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            position: relative;
            z-index: 10;
        }

        .black {
            background: black;
        }

        .white {
            background: white;
            border: 1px solid #333;
        }

        .restart {
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <h1>联机五子棋（跨网对战）</h1>
    <div class="status" id="status">请输入房间号，创建或加入房间</div>
    <div class="room">
        <input type="text" id="roomId" placeholder="输入房间号（数字/字母都行）">
        <button onclick="createRoom()">创建房间</button>
        <button onclick="joinRoom()">加入房间</button>
    </div>
    <div class="board" id="board"></div>
    <button class="restart" id="restartBtn" onclick="restartGame()">再来一局</button>

    <script>
        // 云端实时同步（跨网联机核心）
        const supabaseUrl = "https://ebnnjfcafqrfqpixcfpc.supabase.co";
        const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVibm5qZmNhZnFyZnFwaXhjZnBjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQ1MDQzNjEsImV4cCI6MjA2MDA4MDM2MX0.0yQk1F2fZkX90ZJ4k35uXnQ0FgQ4J0Q0FkX90ZJ4k35uXnQ0FgQ4J0Q0";

        // 全局变量
        let myColor = null; // black / white
        let roomId = null;
        let boardData = Array(15).fill().map(() => Array(15).fill(0));
        let currentTurn = "black";
        let gameOver = false;
        let boardDom = document.getElementById("board");
        let statusText = document.getElementById("status");
        let restartBtn = document.getElementById("restartBtn");

        // 生成棋盘
        function initBoard() {
            boardDom.innerHTML = "";
            for (let i = 0; i < 15; i++) {
                for (let j = 0; j < 15; j++) {
                    let cell = document.createElement("div");
                    cell.className = "cell";
                    cell.dataset.i = i;
                    cell.dataset.j = j;
                    cell.onclick = () => placeChess(i, j);
                    boardDom.appendChild(cell);
                }
            }
        }

        // 渲染棋子
        function render() {
            document.querySelectorAll(".cell").forEach(cell => {
                let i = +cell.dataset.i;
                let j = +cell.dataset.j;
                cell.innerHTML = "";
                if (boardData[i][j] === 1) {
                    cell.innerHTML = `<div class="black"></div>`;
                } else if (boardData[i][j] === 2) {
                    cell.innerHTML = `<div class="white"></div>`;
                }
            });
        }

        // 创建房间
        async function createRoom() {
            roomId = document.getElementById("roomId").value.trim();
            if (!roomId) return alert("请输入房间号");
            myColor = "black";
            currentTurn = "black";
            await syncRoom({
                board: boardData,
                turn: currentTurn,
                blackReady: true,
                whiteReady: false,
                winner: null
            });
            statusText.textContent = "房间创建成功！你是黑子，等待对方加入...";
            listenRoom();
        }

        // 加入房间
        async function joinRoom() {
            roomId = document.getElementById("roomId").value.trim();
            if (!roomId) return alert("请输入房间号");
            myColor = "white";
            let data = await getRoomData();
            if (!data) return alert("房间不存在");
            await syncRoom({ ...data, whiteReady: true });
            statusText.textContent = "加入成功！你是白子，黑子先下";
            listenRoom();
        }

        // 落子
        async function placeChess(i, j) {
            if (!roomId) return alert("请先进入房间");
            if (gameOver) return;
            if (boardData[i][j] !== 0) return;
            if (currentTurn !== myColor) return alert("不是你的回合");

            let val = myColor === "black" ? 1 : 2;
            boardData[i][j] = val;
            currentTurn = myColor === "black" ? "white" : "black";

            let win = checkWin(i, j, val);
            if (win) gameOver = true;

            await syncRoom({
                board: boardData,
                turn: currentTurn,
                winner: win ? myColor : null
            });
        }

        // 判胜
        function checkWin(x, y, v) {
            const dirs = [[1,0],[0,1],[1,1],[1,-1]];
            for (let [dx, dy] of dirs) {
                let count = 1;
                for (let i=1;i<5;i++) {
                    let nx = x+dx*i, ny = y+dy*i;
                    if (nx>=0&&nx<15&&ny>=0&&ny<15&&boardData[nx][ny]===v) count++;
                    else break;
                }
                for (let i=1;i<5;i++) {
                    let nx = x-dx*i, ny = y-dy*i;
                    if (nx>=0&&nx<15&&ny>=0&&ny<15&&boardData[nx][ny]===v) count++;
                    else break;
                }
                if (count >=5) return true;
            }
            return false;
        }

        // 再来一局
        async function restartGame() {
            boardData = Array(15).fill().map(() => Array(15).fill(0));
            currentTurn = "black";
            gameOver = false;
            restartBtn.style.display = "none";
            await syncRoom({
                board: boardData,
                turn: currentTurn,
                winner: null
            });
        }

        // 云端同步
        async function syncRoom(data) {
            await fetch(`${supabaseUrl}/rest/v1/rooms?roomId=eq.${roomId}`, {
                method: "POST",
                headers: { apikey: supabaseKey, "Content-Type": "application/json" },
                body: JSON.stringify({ roomId, ...data })
            });
        }

        // 获取房间数据
        async function getRoomData() {
            let res = await fetch(`${supabaseUrl}/rest/v1/rooms?roomId=eq.${roomId}`, {
                headers: { apikey: supabaseKey }
            });
            let list = await res.json();
            return list[0];
        }

        // 实时监听房间
        async function listenRoom() {
            setInterval(async () => {
                let data = await getRoomData();
                if (!data) return;
                boardData = data.board;
                currentTurn = data.turn;
                render();

                if (data.winner) {
                    statusText.textContent = `${data.winner === "black" ? "黑子" : "白子"}胜利！`;
                    restartBtn.style.display = "block";
                } else {
                    statusText.textContent = `当前回合：${currentTurn === "black" ? "黑子" : "白子"}`;
                }
            }, 1000);
        }

        initBoard();
    </script>
</body>
</html>
