<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>五子棋联机对战</title>
  <script type="module" src="gameLogic.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
    .board {
      display: grid;
      grid-template-columns: repeat(5, 60px);
      gap: 4px;
      margin: 20px auto;
      justify-content: center;
    }
    .cell {
      width: 60px;
      height: 60px;
      border: 1px solid #333;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      background: #fff;
    }
    .cell:hover { background: #f0f0f0; }
    .black { color: #000; }
    .white { color: #fff; background: #666 !important; }
    .waiting-room {
      border: 2px dashed #ccc;
      padding: 10px;
      margin: 10px;
      cursor: pointer;
      border-radius: 8px;
    }
    .waiting-room:hover { border-color: #007bff; }
    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      margin: 5px;
    }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>
  <h1>🎮 五子棋联机对战</h1>
  
  <!-- 房间列表 -->
  <div id="roomList">
    <button onclick="createRoom()">创建房间</button>
    <div id="rooms"></div>
  </div>

  <!-- 游戏区域 -->
  <div id="gameArea" style="display: none;">
    <h3>房间 ID: <span id="roomId"></span></h3>
    <p>你的角色: <span id="role"></span></p>
    <p>当前回合: <span id="currentPlayer"></span></p>
    <div class="board" id="board"></div>
    <button onclick="backToRooms()">返回房间列表</button>
  </div>

  <script type="module">
    import { GomokuGame } from './gameLogic.js';

    let game = null;
    let subscription = null;

    async function loadRooms() {
      const rooms = await GomokuGame.getRooms();
      const container = document.getElementById('rooms');
      container.innerHTML = rooms.length > 0 ? rooms.map(r => `
        <div class="waiting-room" onclick="joinRoom('${r.id}')">
          ${r.id} - ${new Date(r.created_at).toLocaleString()}
        </div>
      `).join('') : '<p>暂无等待中的房间</p>';
    }

    async function createRoom() {
      game = new GomokuGame();
      const roomId = await game.createRoom();
      showGame(roomId, '黑棋');
      startListening();
    }

    async function joinRoom(roomId) {
      game = new GomokuGame();
      try {
        await game.joinRoom(roomId);
        showGame(roomId, '白棋');
        startListening();
      } catch (error) {
        alert(error.message);
        loadRooms();
      }
    }

    function showGame(roomId, role) {
      document.getElementById('roomList').style.display = 'none';
      document.getElementById('gameArea').style.display = 'block';
      document.getElementById('roomId').textContent = roomId;
      document.getElementById('role').textContent = role;
      renderBoard();
    }

    function renderBoard() {
      const board = document.getElementById('board');
      board.innerHTML = game.board.map((cell, index) => `
        <div class="cell ${cell || ''}" onclick="handleClick(${index})">
          ${cell === 'black' ? '●' : cell === 'white' ? '○' : ''}
        </div>
      `).join('');
      document.getElementById('currentPlayer').textContent = 
        game.currentPlayer === 'black' ? '黑棋' : '白棋';
    }

    async function handleClick(index) {
      if (!game || game.board[index]) return;
      try {
        await game.makeMove(index);
        renderBoard();
      } catch (error) {
        alert(error.message);
      }
    }

    function startListening() {
      subscription = game.subscribe(() => {
        renderBoard();
      });
    }

    function backToRooms() {
      if (subscription) subscription.unsubscribe();
      document.getElementById('gameArea').style.display = 'none';
      document.getElementById('roomList').style.display = 'block';
      loadRooms();
    }

    loadRooms();
    setInterval(loadRooms, 5000); // 每5秒刷新房间列表
  </script>
</body>
</html>
